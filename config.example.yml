# =============================================================================
#                       llama -- config.example.yml
# =============================================================================
#  Copy this file to env.yml and customize it for your setup:
#
#      cp config.example.yml env.yml
#
#  Rules:
#    - Lines starting with # are comments (ignored)
#    - Values with ${VAR_NAME} are read from environment variables
#    - Use ${VAR_NAME} for API keys and secrets (never hardcode them)
#    - Indentation uses 2 spaces (YAML standard)
# =============================================================================


# =============================================================================
#                           SERVER CONFIG
# =============================================================================
#  The bridge HTTP server that proxies AI requests.
# =============================================================================

server:
  # Listen address (use 0.0.0.0 to accept remote connections)
  host: 127.0.0.1

  # Listen port
  port: 8089

  # Bearer token required by clients (Authorization: Bearer <token>)
  auth_token: change-me

  # Auto-started servers stop after this many idle seconds.
  # Set to 0 to keep running until `llama stop`.
  idle_timeout_seconds: 180


# =============================================================================
#                           NGROK CONFIG
# =============================================================================
#  Used by `llama start --online` to publish the local bridge through ngrok.
#  Create a token at https://dashboard.ngrok.com/get-started/your-authtoken
# =============================================================================

ngrok:
  auth_token: ${NGROK_AUTHTOKEN}
  region: null


# =============================================================================
#                          AI PROVIDERS
# =============================================================================
#  Each block defines a connection to an AI model backend.
#  The "type" field selects the API protocol:
#
#    openai | ollama_local | ollama_cloud | groq | gemini | cohere
#    mistral | deepseek | openrouter | lm_studio | nvidia_nim
#    openai_compatible | sarvamai | kilo | kimchi | opencode | cline
#
#  Use ${VAR_NAME} for sensitive values (API keys, tokens).
#
#  Fallback API (optional):
#    - fallback_url: Backup API endpoint (used when primary returns 429 rate limit)
#    - fallback_api_key: API key for the fallback endpoint
#    Server automatically switches to fallback when primary hits rate limit.
# =============================================================================

providers:

  # -- Local Providers (no API key needed) --------------------------------

  ollama_local:
    type: ollama_local
    base_url: http://127.0.0.1:11434/v1
    api_key: ollama
    supports_tools: true
    default_model: llama3.1:8b

  lm_studio:
    type: lm_studio
    base_url: http://127.0.0.1:1234/v1
    api_key: lm-studio
    supports_tools: true
    default_model: local-model

  # -- Cloud Providers (API key via environment variable) -----------------

  ollama_cloud:
    type: ollama_cloud
    base_url: https://ollama.com
    api_key: ${OLLAMA_API_KEY}
    fallback_url: null
    fallback_api_key: ${OLLAMA_FALLBACK_API_KEY}
    supports_tools: true
    default_model: gemma4:31b
    usage_limits:
      hourly:
        limit: 1000
        used: 0
        unit: requests
      monthly:
        limit: 50000
        used: 0
        unit: requests

  nvidia_nim:
    type: nvidia_nim
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    supports_tools: true
    default_model: z-ai/glm4.7
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  groq:
    type: groq
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY}
    supports_tools: true
    default_model: openai/gpt-oss-20b

  gemini:
    type: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ${GEMINI_API_KEY}
    supports_tools: true
    default_model: gemini-3-flash-preview

  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    supports_tools: true
    default_model: gpt-5.1

  cohere:
    type: cohere
    base_url: https://api.cohere.com/compatibility/v1
    api_key: ${COHERE_API_KEY}
    supports_tools: true
    default_model: command-a-03-2025

  mistral:
    type: mistral
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    supports_tools: true
    default_model: mistral-large-latest

  deepseek:
    type: deepseek
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    supports_tools: true
    default_model: deepseek-chat

  openrouter:
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    supports_tools: true
    default_model: openrouter/auto

  # -- Generic / Custom Providers ----------------------------------------

  openai_compatible:
    type: openai_compatible
    base_url: https://your-provider.example.com/v1
    api_key: ${CUSTOM_PROVIDER_API_KEY}
    supports_tools: true
    default_model: your-model

  sarvamai:
    type: sarvamai
    base_url: https://api.sarvam.ai/v1
    api_key: ${SARVAM_API_KEY}
    supports_tools: true
    default_model: sarvam-30b

  kilo:
    type: kilo
    base_url: https://api.kilo.ai/api/gateway
    api_key: ${KILO_API_KEY}
    supports_tools: true
    default_model: kilo-auto/free

  opencode:
    type: opencode
    base_url: https://opencode.ai/zen
    api_key: ${OPENCODE_API_KEY}
    fallback_url: null
    fallback_api_key: ${OPENCODE_FALLBACK_API_KEY}
    supports_tools: true
    default_model: opencode/auto

  cline:
    type: cline
    base_url: https://api.cline.bot
    api_key: ${CLINE_API_KEY}
    supports_tools: true
    default_model: deepseek-v4-flash

  kimchi:
    type: kimchi
    base_url: https://llm.kimchi.dev/openai/v1
    api_key: ${CASTAI_API_KEY}
    supports_tools: true
    default_model: kimi-k2.6


# =============================================================================
#                       ANTHROPIC MODEL ALIASES
# =============================================================================
#  Maps Anthropic-style model names to bridge providers/models.
#  Used by clients that request Anthropic model names.
# =============================================================================

anthropic_models:
  haiku:
    provider: ollama_cloud
    model: gemma4:31b
  sonnet:
    provider: ollama_cloud
    model: gemma4:31b
  opus:
    provider: ollama_cloud
    model: gemma4:31b


# =============================================================================
#                        INTEGRATION: PI
# =============================================================================
#  Configuration for the Pi coding agent.
# =============================================================================

pi:
  provider: ollama_cloud
  model: gemma4:31b
  api: openai-completions
  config_dir: ~/.pi/agent
  install_package: "@mariozechner/pi-coding-agent"
  web_search: true


# =============================================================================
#                       INTEGRATION: CODEX
# =============================================================================
#  Configuration for OpenAI Codex CLI.
# =============================================================================

codex:
  provider: ollama_cloud
  model: gemma4:31b
  config_path: ~/.codex/config.toml
  profile: llama_bridge
  install_package: "@openai/codex"


# =============================================================================
#                     INTEGRATION: COPILOT CLI
# =============================================================================
#  Configuration for GitHub Copilot CLI (@github/copilot).
# =============================================================================

copilot_cli:
  provider: ollama_cloud
  model: gemma4:31b
  wire_api: responses
  max_prompt_tokens: 65536
  max_output_tokens: 2048
  install_package: "@github/copilot"


# =============================================================================
#                    INTEGRATION: VS CODE COPILOT LOCAL
# =============================================================================
#  Models advertised through Ollama-compatible /api/tags for VS Code Copilot.
#  VS Code allows up to 3 local Ollama models.
# =============================================================================

vs_copilot:
  models:
    - name: gemma4:31b
      provider: ollama_cloud
      model: gemma4:31b
      context_size: 65536
    - name: minimax
      provider: opencode
      model: minimax-m2.5-free
      context_size: 65536


# =============================================================================
#                      INTEGRATION: OPENCODE
# =============================================================================
#  Configuration for the opencode-ai CLI tool.
# =============================================================================

opencode:
  provider: ollama_cloud
  model: gemma4:31b
  install_package: "opencode-ai"


# =============================================================================
#                      INTEGRATION: POOLSIDE
# =============================================================================
#  Configuration for Poolside AI assistant.
# =============================================================================

poolside:
  provider: ollama_cloud
  model: gemma4:31b
  api_url: http://127.0.0.1:8089
  api_key: null
  token: ${POOLSIDE_TOKEN}
  config_path: ~/.config/poolside/settings.yaml
  install_command: "curl -fsSL https://downloads.poolside.ai/pool/install.sh | sh"
  windows_install_command: "irm https://downloads.poolside.ai/pool/install.ps1 | iex"


# =============================================================================
#                        TELEGRAM BOT
# =============================================================================
#  Optional Telegram bot integration. When enabled, the bridge can
#  receive and respond to messages via Telegram.
# =============================================================================

telegram:
  enabled: false
  bot_token: ${TELEGRAM_BOT_TOKEN}
  allowed_chat_ids: []
  owner_chat_ids: []
  admin_chat_ids: []
  # Secure default: if allow_all_chats is false and all access lists are empty,
  # the Telegram bot rejects every chat until an owner/admin/allowed chat is set.
  allow_all_chats: false
  admin_pin_hash: null
  core_editing_enabled: false
  require_owner_approval_for_core_changes: true
  provider: ollama_cloud
  model: gemma4:31b
  system_prompt: "You are a restricted Telegram bot powered by llama bridge. Answer helpfully, keep replies concise, use bridge tools only when clearly needed, and refuse unsafe or privileged actions."
  max_input_chars: 4000
  max_output_tokens: 512
  poll_interval_seconds: 2.0
  response_timeout_seconds: 180.0
  autonomous_enabled: true
  autonomous_interval_seconds: 1800
  self_evolution_enabled: true
  self_evolution_min_events: 3

  # -- Command permissions ------------------------------------------------
  command_policy:
    help:
      enabled: true
      visible: true
      permission: everyone
    web:
      enabled: true
      visible: true
      permission: everyone
    deep:
      enabled: true
      visible: true
      permission: everyone
    allow:
      enabled: true
      visible: false
      permission: owner
    admin:
      enabled: true
      visible: false
      permission: owner
    core:
      enabled: true
      visible: false
      permission: admin

  # -- AI tool policy ----------------------------------------------------
  tool_policy:
    ai_auto_tools:
      - datetime_now
      - weather_current
      - wikipedia_search
      - tavily_search
      - source_research
      - ddg_image_download
    command_tools:
      - ddg_image_download
      - image_research
      - image_download
      - verify_sources
    blocked_tools:
      - shell.execute
    user_visible_tools:
      - weather_current
      - wikipedia_search
      - tavily_search
      - ddg_image_download
      - image_research
      - image_download
    require_admin_for:
      - shell.execute
    require_owner_for:
      - shell.execute

  # -- Help menu settings ------------------------------------------------
  telegram_help:
    show_disabled_commands: false
    show_tool_list: false
    show_admin_commands_to_admins_only: true


# =============================================================================
#                            TOOL SYSTEM
# =============================================================================
#  Controls the built-in tool management system.
#  Tools allow AI models to perform actions (web search, file ops, etc.).
# =============================================================================

tools:
  enabled: true
  expose_http: true
  require_auth: true
  country: India

  # -- Available tool list ------------------------------------------------
  include:
    - shell.execute
    - datetime_now
    - wikipedia_search
    - wikipedia_page
    - weather_current
    - serpapi_search
    - tavily_search
    - source_research
    - ddg_image_download
    - image_research
    - image_download
    - verify_sources

  # -- Tool selection & filtering ----------------------------------------
  max_exposed: 8
  relevance_filter: true
  force_for_keywords: true
  confidence_threshold: 0.5
  log_outputs: false
  default_search_provider: tavily
  cache_enabled: true
  cache_ttl_seconds: 300
  tool_system_instructions: null
  pi_system_instructions: null

  # -- External tool providers -------------------------------------------

  # SerpAPI (web search via Google)
  serpapi:
    enabled: false
    api_key: ${SERPAPI_API_KEY}
    base_url: https://serpapi.com/search
    defaults:
      engine: google
      num: 5

  # Tavily (AI-native search)
  tavily:
    enabled: false
    api_key: ${TAVILY_API_KEY}
    base_url: https://api.tavily.com/search
    defaults:
      search_depth: basic
      max_results: 5

  # Weather (free, no API key needed)
  weather:
    enabled: true
    provider: open_meteo
    base_url: https://api.open-meteo.com/v1/forecast
    geocoding_url: https://geocoding-api.open-meteo.com/v1/search

  # Wikipedia
  wikipedia:
    enabled: true
    language: en
    base_url: https://en.wikipedia.org


